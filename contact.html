<title>Contact Us — Furnecia</title>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="stylesheet" href="css/style.css">

<div id="site-header"></div>

<div class="page-header">
  <h1>Contact Us</h1>
  <p>Questions about an order or a product? We're happy to help.</p>
</div>

<div class="contact-grid">
  <div>
    <form id="contact-form">
      <div class="form-field">
        <label for="k-name">Name *</label>
        <input type="text" id="k-name" required>
      </div>
      <div class="form-field">
        <label for="k-email">Email *</label>
        <input type="email" id="k-email" required>
      </div>
      <div class="form-field">
        <label for="k-phone">Phone (optional)</label>
        <input type="tel" id="k-phone">
      </div>
      <div class="form-field">
        <label for="k-message">Message *</label>
        <textarea id="k-message" rows="5" required></textarea>
      </div>
      <div class="checkout-actions">
        <a class="btn btn-email" id="k-email-btn">Send via Email</a>
        <a class="btn btn-whatsapp" id="k-wa-btn" target="_blank" rel="noopener noreferrer">Send via WhatsApp</a>
      </div>
    </form>
  </div>

  <div class="contact-info-box">
    <p><strong>Address</strong><span data-shop-address></span></p>
    <p><strong>Email</strong><a data-mail-link href="#" data-shop-email></a></p>
    <p><strong>Phone / WhatsApp</strong><a data-phone-link href="#" data-shop-phone></a></p>
    <p><strong>Delivering across the UK</strong>London, Manchester, Birmingham, Leeds, Glasgow, Liverpool &amp; more.</p>
  </div>
</div>

<div id="site-footer"></div>

<script src="js/config.js"></script>
<script src="js/products.js"></script>
<script src="js/cart.js"></script>
<script src="js/layout.js"></script>
<script src="js/main.js"></script>
<script>
  function refreshContactLinks() {
    const name = document.getElementById("k-name").value.trim();
    const email = document.getElementById("k-email").value.trim();
    const phone = document.getElementById("k-phone").value.trim();
    const message = document.getElementById("k-message").value.trim();
    const body = `Name: ${name}\nEmail: ${email}\n${phone ? "Phone: " + phone + "\n" : ""}\nMessage:\n${message}`;

    document.getElementById("k-email-btn").href = mailLink("Website enquiry — Furnecia", body);
    document.getElementById("k-wa-btn").href = waLink(`Hi Furnecia,\n\n${body}`);
  }
  document.getElementById("contact-form").addEventListener("input", refreshContactLinks);
  refreshContactLinks();

  const requiredIds = ["k-name", "k-email", "k-message"];
  function guardClick(e) {
    const missing = requiredIds.filter(id => !document.getElementById(id).value.trim());
    if (missing.length) {
      e.preventDefault();
      alert("Please fill in your name, email and message first.");
    }
  }
  document.getElementById("k-email-btn").addEventListener("click", guardClick);
  document.getElementById("k-wa-btn").addEventListener("click", guardClick);
</script>
