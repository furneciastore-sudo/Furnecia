<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Shop All Furniture UK | Sofas, Beds & Wardrobes — Furnecia</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="Browse sofa beds, corner sofas, wardrobes, beds, dining tables and more from Furnecia. Cash on Delivery across the UK — free delivery in England, £20 to Wales, £30 to Scotland.">
<link rel="canonical" href="https://furnecia.com/shop.html">
<meta property="og:type" content="website">
<meta property="og:title" content="Shop All Furniture UK | Sofas, Beds & Wardrobes — Furnecia">
<meta property="og:description" content="Cash on Delivery across the UK. Free delivery in England, £20 to Wales, £30 to Scotland.">
<link rel="preconnect" href="https://cdn.shopify.com">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div id="site-header"></div>

<div class="page-header">
  <h1 id="shop-h1">Shop All Furniture</h1>
  <p id="shop-subhead">Cash on Delivery across the UK &middot; Free delivery in England &middot; £20 Wales &middot; £30 Scotland</p>
</div>

<div class="shop-layout">
  <div class="filter-bar" id="filter-bar"></div>
  <div class="shop-toolbar" id="shop-toolbar">
    <label class="shop-toolbar-field">
      Price
      <select id="price-select">
        <option value="">Any price</option>
        <option value="0-100">Under £100</option>
        <option value="100-250">£100 – £250</option>
        <option value="250-500">£250 – £500</option>
        <option value="500-1000">£500 – £1,000</option>
        <option value="1000-">£1,000+</option>
      </select>
    </label>
    <label class="shop-toolbar-field shop-toolbar-checkbox">
      <input type="checkbox" id="instock-checkbox"> In stock only
    </label>
    <label class="shop-toolbar-field">
      Sort by
      <select id="sort-select">
        <option value="featured">Featured</option>
        <option value="price-asc">Price: Low to High</option>
        <option value="price-desc">Price: High to Low</option>
        <option value="bestsellers">Bestsellers</option>
        <option value="newest">Newest</option>
      </select>
    </label>
  </div>
  <p id="results-count" style="font-size:13px;color:var(--text-muted);margin:0 0 16px;"></p>
  <div class="product-grid" id="shop-grid"></div>
  <div style="text-align:center;margin-top:32px;">
    <button class="btn btn-secondary" id="load-more-btn" style="display:none;">Load More</button>
  </div>
</div>

<div id="site-footer"></div>

<script src="js/config.js"></script>
<script src="js/products.js"></script>
<script src="js/shopify-storefront.js"></script>
<script src="js/reviews.js"></script>
<script src="js/cart.js"></script>
<script src="js/layout.js"></script>
<script src="js/main.js"></script>
<script src="js/tracking.js"></script>
<script>
(async () => {
  await window.productsReady;
  const params = new URLSearchParams(window.location.search);
  let activeCat = params.get("cat") || "All";
  const searchQ = (params.get("q") || "").toLowerCase();
  const maxPrice = params.get("max") ? Number(params.get("max")) : null;
  const PAGE_SIZE = 24;
  let visibleCount = PAGE_SIZE;
  let priceRange = "";
  let inStockOnly = false;
  let sortBy = "featured";

  // Keyword-targeted title/description per category, researched against
  // how UK furniture retailers (Sofa Club, IKEA, Furniture Village, Oak
  // Furnitureland) title their equivalent category pages — front-loads
  // the exact term shoppers search ("corner sofa", "sliding wardrobe" etc)
  // then the site's real differentiator (Cash on Delivery) rather than
  // filler words.
  const CATEGORY_SEO = {
    "All": { title: "Shop All Furniture UK | Sofas, Beds & Wardrobes — Furnecia", desc: "Browse sofa beds, corner sofas, wardrobes, beds, dining tables and more from Furnecia. Cash on Delivery across the UK — free delivery in England, £20 to Wales, £30 to Scotland.", h1: "Shop All Furniture" },
    "Sale": { title: "Furniture Sale UK | Sofas, Beds & Wardrobes Reduced — Furnecia", desc: "Shop discounted sofa beds, corner sofas, wardrobes and more in the Furnecia sale. Cash on Delivery, free delivery in England, 30-day returns.", h1: "Furniture Sale" },
    "Sofa Beds": { title: "Sofa Beds UK | Corner & Storage Sofa Beds — Furnecia", desc: "Shop sofa beds UK-wide — corner, storage and fabric sofa beds at affordable prices. Cash on Delivery, free delivery in England, 30-day returns.", h1: "Sofa Beds" },
    "Corner Sofas": { title: "Corner Sofas UK | L-Shaped & 5 Seater Corner Sofas — Furnecia", desc: "Shop corner sofas UK-wide — L-shaped, high-back and 5 seater corner sofas. Cash on Delivery, free delivery in England, 30-day returns.", h1: "Corner Sofas" },
    "Sofas": { title: "Sofas UK | 2, 3 Seater & Chesterfield Sofas — Furnecia", desc: "Shop sofas UK-wide — 2 seater, 3 seater and Chesterfield fabric sofas. Cash on Delivery, free delivery in England, 30-day returns.", h1: "Sofas" },
    "Wardrobes": { title: "Wardrobes UK | Sliding Door & Mirrored Wardrobes — Furnecia", desc: "Shop wardrobes UK-wide — sliding door, mirrored and fitted bedroom wardrobes with drawers. Cash on Delivery, free delivery in England, 30-day returns.", h1: "Wardrobes" },
    "Beds & Mattresses": { title: "Beds & Mattresses UK | Divan, Ottoman & Bunk Beds — Furnecia", desc: "Shop beds and mattresses UK-wide — divan beds, ottoman storage beds, bunk beds and memory foam mattresses. Cash on Delivery, free delivery in England.", h1: "Beds & Mattresses" },
    "Dining Tables": { title: "Dining Tables UK | Extendable & Marble Dining Sets — Furnecia", desc: "Shop dining tables UK-wide — extendable, marble-top and dining table & chair sets. Cash on Delivery, free delivery in England, 30-day returns.", h1: "Dining Tables & Chair Sets" },
    "Coffee Tables": { title: "Coffee Tables UK | Glass & Wood Coffee Tables — Furnecia", desc: "Shop coffee tables UK-wide — glass, marble-effect and wood coffee tables, including nested sets. Cash on Delivery, free delivery in England.", h1: "Coffee Tables" },
    "Bar Stools & Chairs": { title: "Bar Stools & Dining Chairs UK | Swivel Bar Stools — Furnecia", desc: "Shop bar stools and dining chairs UK-wide — swivel gas-lift bar stools, tub armchairs and dining chairs. Cash on Delivery, free delivery on orders £100+.", h1: "Bar Stools & Chairs" },
    "Outdoor Furniture": { title: "Garden & Outdoor Furniture UK | Rattan Patio Sets — Furnecia", desc: "Shop garden and outdoor furniture UK-wide — rattan patio sets, garden corner sofas and dining sets. Cash on Delivery, free delivery in England.", h1: "Outdoor Furniture" },
    "Furniture": { title: "Furniture UK | Affordable Home Furniture — Furnecia", desc: "Shop affordable furniture UK-wide from Furnecia. Cash on Delivery, free delivery in England, £20 to Wales, £30 to Scotland.", h1: "Furniture" },
  };

  function applySEO() {
    const seo = CATEGORY_SEO[activeCat] || CATEGORY_SEO["All"];
    document.title = seo.title;
    const metaDesc = document.querySelector('meta[name="description"]');
    if (metaDesc) metaDesc.setAttribute("content", seo.desc);
    const ogTitle = document.querySelector('meta[property="og:title"]');
    if (ogTitle) ogTitle.setAttribute("content", seo.title);
    const ogDesc = document.querySelector('meta[property="og:description"]');
    if (ogDesc) ogDesc.setAttribute("content", seo.desc);
    const canonical = document.querySelector('link[rel="canonical"]');
    const canonicalUrl = activeCat === "All" ? "https://furnecia.com/shop.html" : `https://furnecia.com/shop.html?cat=${encodeURIComponent(activeCat)}`;
    if (canonical) canonical.setAttribute("href", canonicalUrl);
    document.getElementById("shop-h1").textContent = seo.h1;
  }

  function currentItems() {
    let items = PRODUCTS;
    if (activeCat === "Sale") items = items.filter(p => p.sale);
    else if (activeCat !== "All") items = items.filter(p => p.category === activeCat);
    if (searchQ) items = items.filter(p => p.title.toLowerCase().includes(searchQ) || p.category.toLowerCase().includes(searchQ));
    if (maxPrice) items = items.filter(p => p.price <= maxPrice);
    if (priceRange) {
      const [lo, hi] = priceRange.split("-");
      if (lo) items = items.filter(p => p.price >= Number(lo));
      if (hi) items = items.filter(p => p.price < Number(hi));
    }
    if (inStockOnly) items = items.filter(p => p.variants.some(v => v.available));

    items = items.slice();
    if (sortBy === "price-asc") items.sort((a, b) => a.price - b.price);
    else if (sortBy === "price-desc") items.sort((a, b) => b.price - a.price);
    else if (sortBy === "bestsellers") items.sort((a, b) => (b.bestseller ? 1 : 0) - (a.bestseller ? 1 : 0));
    else if (sortBy === "newest") items.sort((a, b) => new Date(b.createdAt || 0) - new Date(a.createdAt || 0));

    return items;
  }

  function render() {
    applySEO();
    const filterBar = document.getElementById("filter-bar");
    const cats = ["All", "Sale", ...CATEGORIES];
    filterBar.innerHTML = cats.map(c =>
      `<button class="filter-btn ${c === activeCat ? "active" : ""}" data-cat="${c}">${c} (${c === "All" ? PRODUCTS.length : c === "Sale" ? PRODUCTS.filter(p => p.sale).length : PRODUCTS.filter(p => p.category === c).length})</button>`
    ).join("");
    filterBar.querySelectorAll(".filter-btn").forEach(btn => {
      btn.addEventListener("click", () => {
        activeCat = btn.getAttribute("data-cat");
        visibleCount = PAGE_SIZE;
        render();
      });
    });

    const items = currentItems();
    document.getElementById("results-count").textContent = `${items.length} product${items.length === 1 ? "" : "s"}`;

    const grid = document.getElementById("shop-grid");
    const shown = items.slice(0, visibleCount);
    grid.innerHTML = shown.length
      ? shown.map(productCardHTML).join("")
      : `<p style="grid-column:1/-1;text-align:center;color:var(--text-muted);padding:40px 0;">No products found. Try a different search or budget.</p>`;

    const loadMoreBtn = document.getElementById("load-more-btn");
    loadMoreBtn.style.display = items.length > visibleCount ? "inline-block" : "none";
  }
  document.getElementById("load-more-btn").addEventListener("click", () => {
    visibleCount += PAGE_SIZE;
    render();
  });

  const priceSelect = document.getElementById("price-select");
  const instockCheckbox = document.getElementById("instock-checkbox");
  const sortSelect = document.getElementById("sort-select");

  // "Newest" only means something once real Shopify createdAt dates are
  // loaded (js/shopify-storefront.js) — the static fallback catalogue
  // has no reliable creation order, so don't offer a sort that would lie.
  if (!PRODUCTS.some(p => p.createdAt)) {
    sortSelect.querySelector('option[value="newest"]').remove();
  }

  priceSelect.addEventListener("change", () => { priceRange = priceSelect.value; visibleCount = PAGE_SIZE; render(); });
  instockCheckbox.addEventListener("change", () => { inStockOnly = instockCheckbox.checked; visibleCount = PAGE_SIZE; render(); });
  sortSelect.addEventListener("change", () => { sortBy = sortSelect.value; visibleCount = PAGE_SIZE; render(); });

  render();
})();
</script>
</body>
</html>
