<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Shop All Furniture — Furnecia</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="Browse sofa beds, corner sofas, wardrobes, beds and outdoor furniture from Furnecia. Cash on Delivery across the UK, free delivery on selected items.">
<link rel="canonical" href="https://furnecia.com/shop.html">
<meta property="og:type" content="website">
<meta property="og:title" content="Shop All Furniture — Furnecia">
<meta property="og:description" content="Cash on Delivery across the UK. Free delivery on selected items, 30-day returns.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="preconnect" href="https://cdn.shopify.com">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div id="site-header"></div>

<div class="page-header">
  <h1>Shop All Furniture</h1>
  <p>Cash on Delivery across the UK &middot; Free delivery on selected items</p>
</div>

<div class="shop-layout">
  <div class="filter-bar" id="filter-bar"></div>
  <div class="product-grid" id="shop-grid"></div>
</div>

<div id="site-footer"></div>

<script src="js/config.js"></script>
<script src="js/products.js"></script>
<script src="js/cart.js"></script>
<script src="js/layout.js"></script>
<script src="js/main.js"></script>
<script>
  const params = new URLSearchParams(window.location.search);
  let activeCat = params.get("cat") || "All";
  const searchQ = (params.get("q") || "").toLowerCase();
  const maxPrice = params.get("max") ? Number(params.get("max")) : null;

  function render() {
    const filterBar = document.getElementById("filter-bar");
    const cats = ["All", "Sale", ...CATEGORIES];
    filterBar.innerHTML = cats.map(c =>
      `<button class="filter-btn ${c === activeCat ? "active" : ""}" data-cat="${c}">${c}</button>`
    ).join("");
    filterBar.querySelectorAll(".filter-btn").forEach(btn => {
      btn.addEventListener("click", () => {
        activeCat = btn.getAttribute("data-cat");
        render();
      });
    });

    let items = PRODUCTS;
    if (activeCat === "Sale") items = items.filter(p => p.sale);
    else if (activeCat !== "All") items = items.filter(p => p.category === activeCat);
    if (searchQ) items = items.filter(p => p.title.toLowerCase().includes(searchQ) || p.category.toLowerCase().includes(searchQ));
    if (maxPrice) items = items.filter(p => p.price <= maxPrice);

    const grid = document.getElementById("shop-grid");
    grid.innerHTML = items.length
      ? items.map(productCardHTML).join("")
      : `<p style="grid-column:1/-1;text-align:center;color:var(--text-muted);padding:40px 0;">No products found. Try a different search or budget.</p>`;
  }
  render();
</script>
</body>
</html>
