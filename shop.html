<title>Shop All Furniture — Furnecia</title>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="stylesheet" href="css/style.css">

<div id="site-header"></div>

<div class="page-header">
  <h1>Shop All Furniture</h1>
  <p>Cash on Delivery across the UK &middot; Free delivery on selected items</p>
</div>

<div class="shop-layout">
  <div class="filter-bar" id="filter-bar"></div>
  <div class="product-grid" id="shop-grid"></div>
</div>

<div id="site-footer"></div>

<script src="js/config.js"></script>
<script src="js/products.js"></script>
<script src="js/cart.js"></script>
<script src="js/layout.js"></script>
<script src="js/main.js"></script>
<script>
  const params = new URLSearchParams(window.location.search);
  let activeCat = params.get("cat") || "All";
  const searchQ = (params.get("q") || "").toLowerCase();
  const maxPrice = params.get("max") ? Number(params.get("max")) : null;

  function render() {
    const filterBar = document.getElementById("filter-bar");
    const cats = ["All", ...CATEGORIES];
    filterBar.innerHTML = cats.map(c =>
      `<button class="filter-btn ${c === activeCat ? "active" : ""}" data-cat="${c}">${c}</button>`
    ).join("");
    filterBar.querySelectorAll(".filter-btn").forEach(btn => {
      btn.addEventListener("click", () => {
        activeCat = btn.getAttribute("data-cat");
        render();
      });
    });

    let items = PRODUCTS;
    if (activeCat !== "All") items = items.filter(p => p.category === activeCat);
    if (searchQ) items = items.filter(p => p.title.toLowerCase().includes(searchQ) || p.category.toLowerCase().includes(searchQ));
    if (maxPrice) items = items.filter(p => p.price <= maxPrice);

    const grid = document.getElementById("shop-grid");
    grid.innerHTML = items.length
      ? items.map(productCardHTML).join("")
      : `<p style="grid-column:1/-1;text-align:center;color:var(--text-muted);padding:40px 0;">No products found. Try a different search or budget.</p>`;
  }
  render();
</script>
