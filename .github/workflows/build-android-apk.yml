name: Build Furnecia Dashboard Android APK

# Builds the fully offline dashboard (dashboard/) as a static site, then
# wraps it in the Capacitor Android project (dashboard/android) on
# GitHub's own runners, which have normal internet access to Google's
# Android Maven repo — unlike some sandboxed dev environments. Run this
# manually whenever you want a fresh .apk, then download it from the
# run's "Artifacts" section. No server URL is needed — everything ships
# inside the APK.
on:
  workflow_dispatch:
  # workflow_dispatch only appears in the Actions UI once this file is on
  # the default branch. Until this PR merges, pushing to this branch (or
  # editing this file) also triggers a build, so it can still be tested.
  push:
    branches: ["claude/furniture-order-dashboard-lypjkk"]
    paths: [".github/workflows/build-android-apk.yml"]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dashboard
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"

      - name: Install dependencies
        run: npm ci

      - name: Build static site
        run: npm run build

      - name: Sync Capacitor Android project
        run: npx cap sync android

      - name: Build debug APK
        working-directory: dashboard/android
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload APK (workflow artifact)
        uses: actions/upload-artifact@v4
        with:
          name: furnecia-dashboard-debug-apk
          path: dashboard/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

      # Workflow artifacts always download via Azure Blob Storage, which
      # some restricted networks block. A GitHub Release asset is a
      # second copy of the same file that can instead be fetched straight
      # from api.github.com — see "Downloading the APK" in ANDROID.md.
      - name: Publish APK as a release asset
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete android-apk-latest --yes --cleanup-tag || true
          gh release create android-apk-latest \
            android/app/build/outputs/apk/debug/app-debug.apk \
            --title "Furnecia Dashboard (Android, debug build)" \
            --notes "Automatically built from ${{ github.sha }}. Offline app — install and go, no server needed." \
            --target ${{ github.sha }}
