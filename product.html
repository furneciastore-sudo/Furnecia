<title>Product — Furnecia</title>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="stylesheet" href="css/style.css">

<div id="site-header"></div>

<div id="product-root"></div>

<div id="site-footer"></div>

<script src="js/config.js"></script>
<script src="js/products.js"></script>
<script src="js/cart.js"></script>
<script src="js/layout.js"></script>
<script src="js/main.js"></script>
<script>
  const handle = new URLSearchParams(window.location.search).get("handle");
  const product = getProductByHandle(handle);
  const root = document.getElementById("product-root");

  if (!product) {
    root.innerHTML = `<div class="content-page" style="text-align:center;"><h1>Product not found</h1><p><a href="shop.html">Back to shop</a></p></div>`;
  } else {
    document.title = product.title + " — Furnecia";
    root.innerHTML = `
      <div class="product-detail">
        <div class="product-detail-img">
          <img src="${product.image}" alt="${product.title}">
        </div>
        <div class="product-detail-info">
          <span class="product-detail-category">${product.category}</span>
          <h1>${product.title}</h1>
          <span class="product-detail-price">${formatPrice(product.price)}</span>

          <div class="qty-row">
            <button type="button" id="qty-minus">−</button>
            <input type="number" id="qty-input" value="1" min="1">
            <button type="button" id="qty-plus">+</button>
          </div>

          <div class="detail-actions">
            <button class="btn btn-primary" id="add-to-cart-btn">Add to Cart</button>
            <a class="btn btn-whatsapp" id="wa-order-btn" target="_blank" rel="noopener noreferrer">Order via WhatsApp</a>
          </div>

          <div class="trust-badges">
            <span>🚚 Cash on Delivery — pay when it arrives</span>
            <span>🇬🇧 Free UK delivery on selected items</span>
            <span>↻ 30-day returns</span>
          </div>
        </div>
      </div>
    `;

    const qtyInput = document.getElementById("qty-input");
    document.getElementById("qty-minus").addEventListener("click", () => {
      qtyInput.value = Math.max(1, Number(qtyInput.value) - 1);
      updateWaLink();
    });
    document.getElementById("qty-plus").addEventListener("click", () => {
      qtyInput.value = Number(qtyInput.value) + 1;
      updateWaLink();
    });
    qtyInput.addEventListener("input", updateWaLink);

    document.getElementById("add-to-cart-btn").addEventListener("click", () => {
      addToCart(product.handle, Number(qtyInput.value) || 1);
      alert("Added to cart!");
    });

    function updateWaLink() {
      const qty = Number(qtyInput.value) || 1;
      const msg = `Hi Furnecia, I'd like to order:\n${qty} x ${product.title} — ${formatPrice(product.price)} each\nTotal: ${formatPrice(product.price * qty)}\n\nMy name:\nMy address:\nMy phone:`;
      document.getElementById("wa-order-btn").href = waLink(msg);
    }
    updateWaLink();
  }
</script>
