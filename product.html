<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Product — Furnecia</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="Shop quality furniture at Furnecia with Cash on Delivery across the UK.">
<link rel="preconnect" href="https://cdn.shopify.com">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div id="site-header"></div>

<div id="product-root"></div>

<div id="site-footer"></div>

<script src="js/config.js"></script>
<script src="js/products.js"></script>
<script src="js/reviews.js"></script>
<script src="js/cart.js"></script>
<script src="js/layout.js"></script>
<script src="js/main.js"></script>
<script>
  const handle = new URLSearchParams(window.location.search).get("handle");
  const product = getProductByHandle(handle);
  const root = document.getElementById("product-root");

  if (!product) {
    root.innerHTML = `<div class="content-page" style="text-align:center;"><h1>Product not found</h1><p><a href="shop.html">Back to shop</a></p></div>`;
  } else {
    document.title = product.title + " — Furnecia";
    const metaDesc = document.querySelector('meta[name="description"]');
    if (metaDesc) metaDesc.setAttribute("content", `${product.title} — ${formatPrice(product.price)}. Cash on Delivery across the UK, free delivery in England (£20 Wales, £30 Scotland), 30-day returns.`);

    let selectedVariant = defaultVariant(product);
    let selectedImage = selectedVariant.image || product.images[0];

    const thumbsHTML = product.images.map((img, idx) => `
      <button type="button" class="gallery-thumb ${img === selectedImage ? "active" : ""}" data-img="${img}">
        <img src="${shopifyImg(img, 150)}" alt="${product.title} photo ${idx + 1}" loading="lazy" ${imgFallbackAttr()}>
      </button>
    `).join("");

    const hasRealOptions = product.options && product.options.length > 0;
    const variantSwatchesHTML = hasRealOptions ? `
      <div class="variant-group">
        <span class="variant-group-label">${product.options[0].name}: <span id="selected-variant-label">${selectedVariant.title}</span></span>
        <div class="variant-swatches">
          ${product.variants.map(v => `
            <button type="button" class="variant-swatch ${v.title === selectedVariant.title ? "active" : ""} ${!v.available ? "unavailable" : ""}"
              data-variant="${v.title.replace(/"/g, "&quot;")}" ${!v.available ? "disabled" : ""}>${v.title}</button>
          `).join("")}
        </div>
      </div>
    ` : "";

    function priceRowHTML(v) {
      const onSale = v.compareAtPrice && v.compareAtPrice > v.price;
      return onSale
        ? `<span class="product-detail-price">${formatPrice(v.price)}</span>
           <span class="product-detail-was">${formatPrice(v.compareAtPrice)}</span>
           <span class="product-detail-off">Save ${Math.round((1 - v.price / v.compareAtPrice) * 100)}%</span>`
        : `<span class="product-detail-price">${formatPrice(v.price)}</span>`;
    }

    root.innerHTML = `
      <div class="product-detail">
        <div class="product-gallery">
          ${product.images.length > 1 ? `<div class="gallery-thumbs" id="gallery-thumbs">${thumbsHTML}</div>` : ""}
          <div class="product-detail-img" id="zoom-trigger">
            <div class="gallery-track" id="gallery-track" style="transform: translateX(-${Math.max(0, product.images.indexOf(selectedImage)) * 100}%)">
              ${product.images.map((img, idx) => `
                <div class="gallery-slide"><img src="${shopifyImg(img, 1200)}" alt="${product.title} photo ${idx + 1}" ${idx === 0 ? "" : 'loading="lazy"'} ${imgFallbackAttr()}></div>
              `).join("")}
            </div>
            <span class="zoom-hint">Click to zoom</span>
            ${product.images.length > 1 ? `
              <button type="button" class="gallery-nav gallery-nav-prev" id="gallery-prev" aria-label="Previous photo">&#8249;</button>
              <button type="button" class="gallery-nav gallery-nav-next" id="gallery-next" aria-label="Next photo">&#8250;</button>
              <div class="gallery-dots" id="gallery-dots">
                ${product.images.map((img, idx) => `<span class="gallery-dot ${img === selectedImage ? "active" : ""}" data-idx="${idx}"></span>`).join("")}
              </div>
            ` : ""}
          </div>
        </div>
        <div class="product-detail-info">
          <span class="product-detail-category">${product.category}</span>
          <h1>${product.title}</h1>
          ${ratingRowHTML(product.handle, { size: "sm" })}
          <div class="product-detail-price-row" id="price-row">${priceRowHTML(selectedVariant)}</div>

          ${variantSwatchesHTML}

          <div class="qty-row">
            <button type="button" id="qty-minus">−</button>
            <input type="number" id="qty-input" value="1" min="1">
            <button type="button" id="qty-plus">+</button>
          </div>

          <div class="detail-actions">
            <button class="btn btn-solid" id="add-to-cart-btn">Add to Cart</button>
            <a class="btn btn-whatsapp" id="wa-order-btn" target="_blank" rel="noopener noreferrer">Order via WhatsApp</a>
          </div>

          <div class="delivery-box">
            <span class="db-icon">🚚</span>
            <div>
              <strong>Estimated delivery: <span id="delivery-dates"></span></strong>
              <span>Order today and we'll aim to have it with you within 3–5 working days.</span>
            </div>
          </div>

          <div class="trust-badges">
            <span>💷 Cash on Delivery — pay when it arrives</span>
            <span>🇬🇧 Free delivery in England &middot; £20 Wales &middot; £30 Scotland</span>
            <span>↻ 30-day returns</span>
            <span>💬 Questions? <a href="#" data-wa-link="Hi Furnecia, I have a question about: ${product.title.replace(/"/g, "&quot;")}" target="_blank" rel="noopener noreferrer" style="color:var(--brown);font-weight:600;">Chat with us on WhatsApp</a></span>
          </div>
        </div>
      </div>
    ` + reviewsSectionHTML(product.handle) + relatedProductsHTML(product, 4);

    document.getElementById("delivery-dates").textContent = deliveryEstimateText();

    const { rating: ldRating, count: ldCount } = ratingSummary(product.handle);
    const ld = document.createElement("script");
    ld.type = "application/ld+json";
    ld.textContent = JSON.stringify({
      "@context": "https://schema.org",
      "@type": "Product",
      name: product.title,
      image: product.images,
      category: product.category,
      brand: { "@type": "Brand", name: "Furnecia" },
      aggregateRating: {
        "@type": "AggregateRating",
        ratingValue: ldRating,
        reviewCount: ldCount
      },
      offers: {
        "@type": "Offer",
        priceCurrency: "GBP",
        price: selectedVariant.price,
        availability: "https://schema.org/InStock",
        url: window.location.href
      }
    });
    document.head.appendChild(ld);

    // ---- gallery thumbnail switching ----
    function setMainImage(url) {
      selectedImage = url;
      const idx = product.images.indexOf(url);
      const track = document.getElementById("gallery-track");
      if (track && idx > -1) track.style.transform = `translateX(-${idx * 100}%)`;
      document.querySelectorAll(".gallery-thumb").forEach(t => t.classList.toggle("active", t.getAttribute("data-img") === url));
      document.querySelectorAll(".gallery-dot").forEach(d => d.classList.toggle("active", product.images[d.getAttribute("data-idx")] === url));
    }
    document.querySelectorAll(".gallery-thumb").forEach(btn => {
      btn.addEventListener("click", () => setMainImage(btn.getAttribute("data-img")));
    });

    // ---- gallery swipe / arrow navigation ----
    if (product.images.length > 1) {
      const stepImage = (dir) => {
        const i = product.images.indexOf(selectedImage);
        const next = (i + dir + product.images.length) % product.images.length;
        setMainImage(product.images[next]);
      };
      document.getElementById("gallery-prev").addEventListener("click", (e) => { e.stopPropagation(); stepImage(-1); });
      document.getElementById("gallery-next").addEventListener("click", (e) => { e.stopPropagation(); stepImage(1); });
      document.querySelectorAll(".gallery-dot").forEach(dot => {
        dot.addEventListener("click", (e) => { e.stopPropagation(); setMainImage(product.images[dot.getAttribute("data-idx")]); });
      });
      const zoomTrigger = document.getElementById("zoom-trigger");
      let touchStartX = null;
      zoomTrigger.addEventListener("touchstart", (e) => { touchStartX = e.changedTouches[0].clientX; }, { passive: true });
      zoomTrigger.addEventListener("touchend", (e) => {
        if (touchStartX === null) return;
        const dx = e.changedTouches[0].clientX - touchStartX;
        if (Math.abs(dx) > 40) {
          e.preventDefault();
          stepImage(dx < 0 ? 1 : -1);
        }
        touchStartX = null;
      });
    }

    // ---- variant swatch switching ----
    document.querySelectorAll(".variant-swatch").forEach(btn => {
      btn.addEventListener("click", () => {
        if (btn.disabled) return;
        const v = getVariant(product, btn.getAttribute("data-variant"));
        selectedVariant = v;
        document.querySelectorAll(".variant-swatch").forEach(b => b.classList.remove("active"));
        btn.classList.add("active");
        const lbl = document.getElementById("selected-variant-label");
        if (lbl) lbl.textContent = v.title;
        document.getElementById("price-row").innerHTML = priceRowHTML(v);
        if (v.image) setMainImage(v.image);
        updateWaLink();
      });
    });

    const qtyInput = document.getElementById("qty-input");
    document.getElementById("qty-minus").addEventListener("click", () => {
      qtyInput.value = Math.max(1, Number(qtyInput.value) - 1);
      updateWaLink();
    });
    document.getElementById("qty-plus").addEventListener("click", () => {
      qtyInput.value = Number(qtyInput.value) + 1;
      updateWaLink();
    });
    qtyInput.addEventListener("input", updateWaLink);

    document.getElementById("add-to-cart-btn").addEventListener("click", () => {
      addToCart(product.handle, selectedVariant.title, Number(qtyInput.value) || 1);
      alert("Added to cart!");
    });

    function updateWaLink() {
      const qty = Number(qtyInput.value) || 1;
      const variantLabel = selectedVariant.title !== "Default" ? ` (${selectedVariant.title})` : "";
      const msg = `Hi Furnecia, I'd like to order:\n${qty} x ${product.title}${variantLabel} — ${formatPrice(selectedVariant.price)} each\nTotal: ${formatPrice(selectedVariant.price * qty)}\n\nMy name:\nMy address:\nMy phone:`;
      document.getElementById("wa-order-btn").href = waLink(msg);
    }
    updateWaLink();

    // simple click-to-zoom lightbox
    document.getElementById("zoom-trigger").addEventListener("click", () => {
      const box = document.createElement("div");
      box.className = "img-lightbox";
      box.innerHTML = `<button class="img-lightbox-close" aria-label="Close">&times;</button><img src="${shopifyImg(selectedImage, 1800)}" alt="${product.title}">`;
      box.addEventListener("click", () => box.remove());
      document.body.appendChild(box);
    });
  }
</script>
</body>
</html>
