<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Product — Furnecia</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="Shop quality furniture at Furnecia with Cash on Delivery across the UK.">
<link rel="preconnect" href="https://cdn.shopify.com">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div id="site-header"></div>

<div id="product-root"></div>

<div id="site-footer"></div>

<script src="js/config.js"></script>
<script src="js/products.js"></script>
<script src="js/cart.js"></script>
<script src="js/layout.js"></script>
<script src="js/main.js"></script>
<script>
  const handle = new URLSearchParams(window.location.search).get("handle");
  const product = getProductByHandle(handle);
  const root = document.getElementById("product-root");

  if (!product) {
    root.innerHTML = `<div class="content-page" style="text-align:center;"><h1>Product not found</h1><p><a href="shop.html">Back to shop</a></p></div>`;
  } else {
    document.title = product.title + " — Furnecia";
    const metaDesc = document.querySelector('meta[name="description"]');
    if (metaDesc) metaDesc.setAttribute("content", `${product.title} — ${formatPrice(product.price)}. Cash on Delivery across the UK, free delivery on selected items, 30-day returns.`);

    const onSale = product.sale && product.compareAtPrice;
    const priceRow = onSale
      ? `<span class="product-detail-price">${formatPrice(product.price)}</span>
         <span class="product-detail-was">${formatPrice(product.compareAtPrice)}</span>
         <span class="product-detail-off">Save ${discountPercent(product)}%</span>`
      : `<span class="product-detail-price">${formatPrice(product.price)}</span>`;

    root.innerHTML = `
      <div class="product-detail">
        <div class="product-detail-img" id="zoom-trigger">
          <img src="${product.image}" alt="${product.title}" id="main-product-img" ${imgFallbackAttr()}>
          <span class="zoom-hint">🔍 Click to zoom</span>
        </div>
        <div class="product-detail-info">
          <span class="product-detail-category">${product.category}</span>
          <h1>${product.title}</h1>
          <div class="product-detail-price-row">${priceRow}</div>

          <div class="qty-row">
            <button type="button" id="qty-minus">−</button>
            <input type="number" id="qty-input" value="1" min="1">
            <button type="button" id="qty-plus">+</button>
          </div>

          <div class="detail-actions">
            <button class="btn btn-primary" id="add-to-cart-btn">Add to Cart</button>
            <a class="btn btn-whatsapp" id="wa-order-btn" target="_blank" rel="noopener noreferrer">Order via WhatsApp</a>
          </div>

          <div class="delivery-box">
            <span class="db-icon">🚚</span>
            <div>
              <strong>Estimated delivery: <span id="delivery-dates"></span></strong>
              <span>Order today and we'll aim to have it with you within 3–5 working days.</span>
            </div>
          </div>

          <div class="trust-badges">
            <span>💷 Cash on Delivery — pay when it arrives</span>
            <span>🇬🇧 Free UK delivery on selected items</span>
            <span>↻ 30-day returns</span>
            <span>💬 Questions? <a href="#" data-wa-link="Hi Furnecia, I have a question about: ${product.title.replace(/"/g, "&quot;")}" target="_blank" rel="noopener noreferrer" style="color:var(--brown);font-weight:600;">Chat with us on WhatsApp</a></span>
          </div>
        </div>
      </div>
    `;

    document.getElementById("delivery-dates").textContent = deliveryEstimateText();

    const ld = document.createElement("script");
    ld.type = "application/ld+json";
    ld.textContent = JSON.stringify({
      "@context": "https://schema.org",
      "@type": "Product",
      name: product.title,
      image: product.image,
      category: product.category,
      brand: { "@type": "Brand", name: "Furnecia" },
      offers: {
        "@type": "Offer",
        priceCurrency: "GBP",
        price: product.price,
        availability: "https://schema.org/InStock",
        url: window.location.href
      }
    });
    document.head.appendChild(ld);

    const qtyInput = document.getElementById("qty-input");
    document.getElementById("qty-minus").addEventListener("click", () => {
      qtyInput.value = Math.max(1, Number(qtyInput.value) - 1);
      updateWaLink();
    });
    document.getElementById("qty-plus").addEventListener("click", () => {
      qtyInput.value = Number(qtyInput.value) + 1;
      updateWaLink();
    });
    qtyInput.addEventListener("input", updateWaLink);

    document.getElementById("add-to-cart-btn").addEventListener("click", () => {
      addToCart(product.handle, Number(qtyInput.value) || 1);
      alert("Added to cart!");
    });

    function updateWaLink() {
      const qty = Number(qtyInput.value) || 1;
      const msg = `Hi Furnecia, I'd like to order:\n${qty} x ${product.title} — ${formatPrice(product.price)} each\nTotal: ${formatPrice(product.price * qty)}\n\nMy name:\nMy address:\nMy phone:`;
      document.getElementById("wa-order-btn").href = waLink(msg);
    }
    updateWaLink();

    // simple click-to-zoom lightbox (works with a single product photo)
    document.getElementById("zoom-trigger").addEventListener("click", () => {
      const box = document.createElement("div");
      box.className = "img-lightbox";
      box.innerHTML = `<button class="img-lightbox-close" aria-label="Close">&times;</button><img src="${product.image}" alt="${product.title}">`;
      box.addEventListener("click", () => box.remove());
      document.body.appendChild(box);
    });
  }
</script>
</body>
</html>
